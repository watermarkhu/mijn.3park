name: Release

on:
  pull_request:
    types:
      - closed
      - opened
      - reopened
      - synchronize
    branches: [main]

# Releases must never be interrupted mid-publish; queue instead of cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Semantic version release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write # Required for adding the labels to the PR
      issues: write # Required for adding labels to the repository
    outputs:
      release: ${{ steps.get-version.outputs.release }}
      tag: ${{ steps.get-version.outputs.tag }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Get semantic version
        uses: RonaldPhilipsen/semVersie@v2.3.4
        id: get-version
        with:
          add-pr-label: true
          label-prefix: false

  build:
    name: Build signed release
    needs: release
    if: needs.release.outputs.release == 'true' # && github.event.pull_request.merged
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # create/upload the GitHub release asset
      id-token: write # required for actions/attest-build-provenance
      attestations: write # required for actions/attest-build-provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Android build
        uses: ./.github/actions/setup-android-build

      - name: Patch version into build config
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ needs.release.outputs.version }}
        run: |
          # versionCode must be unique and strictly increasing across every
          # Play track; derive it from the count of GitHub releases so far.
          RELEASE_COUNT=$(gh release list --limit 1000 --json tagName --jq 'length')
          VERSION_CODE=$((RELEASE_COUNT + 1))
          echo "Patching versionCode=$VERSION_CODE versionName=$VERSION_NAME"
          sed -i "s/^\( *\)versionCode = .*/\1versionCode = $VERSION_CODE/" app/build.gradle.kts
          sed -i "s/^\( *\)versionName = .*/\1versionName = \"$VERSION_NAME\"/" app/build.gradle.kts

      - name: Decrypt upload keystore
        env:
          KEYSTORE_PASSPHRASE: ${{ secrets.MIJN3PARK_KEYSTORE_GPG_PASSPHRASE }}
        run: |
          gpg --quiet --batch --yes --decrypt \
            --passphrase "$KEYSTORE_PASSPHRASE" \
            --output "$RUNNER_TEMP/upload.jks" app/upload.jks.gpg

      - name: Build signed release bundle
        env:
          MIJN3PARK_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          MIJN3PARK_KEYSTORE_PASSWORD: ${{ secrets.MIJN3PARK_KEYSTORE_PASSWORD }}
          MIJN3PARK_KEY_ALIAS: ${{ vars.MIJN3PARK_KEY_ALIAS }}
          MIJN3PARK_KEY_PASSWORD: ${{ secrets.MIJN3PARK_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:bundleRelease --stacktrace

      - name: Attest release bundle provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Attach bundle to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          gh release create "$TAG" "$AAB" --title "$VERSION" --generate-notes \
            || gh release upload "$TAG" "$AAB" --clobber

      - name: Publish to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.MIJN3PARK_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.watermarkhu.mijn3park
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
          releaseName: ${{ needs.release.outputs.version }}

name: Set up Android build
description: >-
  Installs JDK 17, the Android SDK (platform + build-tools) and Gradle so the
  app can be built. The repository must already be checked out.

inputs:
  cache-read-only:
    description: Whether the Gradle cache is read-only for this run.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: "17"

    - name: Set up Android SDK
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

    - name: Install Android platform and build-tools
      shell: bash
      run: |
        # Extract compileSdk and buildToolsVersion from app/build.gradle.kts so
        # this action never drifts from the SDK levels the app actually builds.
        compile_sdk="$(sed -nE 's/^[[:space:]]*compileSdk[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -n1)"
        build_tools="$(sed -nE 's/^[[:space:]]*buildToolsVersion[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)"
        if [[ -z "$compile_sdk" || -z "$build_tools" ]]; then
          echo "::error::Could not extract compileSdk/buildToolsVersion from app/build.gradle.kts" >&2
          exit 1
        fi

        # From API 37 on, platforms are minor-versioned (platforms;android-37.2)
        # instead of plain platforms;android-37. Prefer the exact package and
        # fall back to the newest stable android-<compileSdk>.<minor>.
        platform="platforms;android-$compile_sdk"
        if ! sdkmanager --list 2>/dev/null | grep -E "^[[:space:]]*$platform([[:space:]]|$)" >/dev/null; then
          platform="$(sdkmanager --list 2>/dev/null \
            | sed -nE "s/^[[:space:]]*(platforms;android-${compile_sdk}(\\.[0-9]+)?).*/\\1/p" \
            | grep -vE -- "-[a-z]" \
            | sort -Vu | tail -n1)"
          if [[ -z "$platform" ]]; then
            echo "::error::No installable SDK platform found for compileSdk $compile_sdk" >&2
            exit 1
          fi
        fi
        sdkmanager "$platform" "build-tools;$build_tools"

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      with:
        cache-read-only: ${{ inputs.cache-read-only }}

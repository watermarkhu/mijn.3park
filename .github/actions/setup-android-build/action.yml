name: Set up Android build
description: >-
  Installs JDK 17, the Android SDK (platform + build-tools) and Gradle so the
  app can be built. The repository must already be checked out.

inputs:
  cache-read-only:
    description: Whether the Gradle cache is read-only for this run.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: "17"

    - name: Set up Android SDK
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

    - name: Install Android platform and build-tools
      shell: bash
      run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      with:
        cache-read-only: ${{ inputs.cache-read-only }}
